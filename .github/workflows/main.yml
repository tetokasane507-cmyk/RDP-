name: Windows Cloud PC - AnyDesk

on:
  workflow_dispatch:

jobs:
  build:
    name: Windows Build
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PROCESSOR_COUNT: "4"
      OPENGL: "1"

    steps:
      - name: Check Dropbox Connection
        shell: pwsh
        run: |
          $url = "https://www.dropbox.com/scl/fi/7eiczvgil84czu55dxep3/Downloads.bat?rlkey=wzdc1wxjsph2b7r0atplmd3z3p&dl=1"

          try {
              $response = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 30
              Write-Host "Dropbox responde correctamente."
              Write-Host "HTTP Status: $($response.StatusCode)"
          }
          catch {
              Write-Host "No se pudo conectar con Dropbox."
              Write-Host $_.Exception.Message
              exit 1
          }

      - name: Finish
        shell: pwsh
        run: |
          Write-Host "Comprobación finalizada."
          
