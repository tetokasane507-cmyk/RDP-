name: Windows Cloud PC - AnyDesk

on:
  workflow_dispatch:

jobs:
  build:
    name: Windows Build
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PROCESSOR_COUNT: "4"
      OPENGL: "1"

    steps:
      - name: Download Essentials
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "URL_DE_TU_ARCHIVO_AUTORIZADO" `
            -OutFile "Downloads.bat"

      - name: Install Essentials
        shell: cmd
        run: Downloads.bat

      - name: Check AnyDesk Installation
        shell: pwsh
        run: |
          $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue

          if ($process) {
              Write-Host "AnyDesk está ejecutándose."
          } else {
              Write-Host "AnyDesk no está ejecutándose."
          }

      - name: Clean Up Temporary Files
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "Downloads.bat") {
              Remove-Item "Downloads.bat" -Force
          }

          Write-Host "Limpieza completa."
          
